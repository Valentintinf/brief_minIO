x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.3
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'brief-minio-datalake'
    _PIP_ADDITIONAL_REQUIREMENTS: 'boto3>=1.34 pandas>=2.0 pyarrow>=14.0'
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data:ro
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  # ── Stockage objet ──────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (boto3, SDK)
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # ── Jour 6-7 (C21) — KMS interne pour le chiffrement SSE-S3 ─────────────
      # SSE-S3 exige un KMS : MinIO en fournit un, à clé statique, suffisant
      # hors production. Format « nom-de-clé:clé-32-octets-en-base64 ».
      # Clé de démonstration, à surcharger dans .env pour tout autre usage :
      #   MINIO_KMS_SECRET_KEY=datalake-key:$(openssl rand -base64 32)
      # Perdre cette clé rend les objets chiffrés définitivement illisibles.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-datalake-key:oMvLtNndBU6f3VkMVCkY39r4S1Q+52pCVuuDrUSMJZc=}
      # ── Journal d'audit : chaque appel S3 est posté au collecteur ───────────
      MINIO_AUDIT_WEBHOOK_ENABLE_datalake: "on"
      MINIO_AUDIT_WEBHOOK_ENDPOINT_datalake: http://audit-collector:9999/audit
    volumes:
      - ./minio-data:/data
    # MinIO refuse de démarrer si la cible du webhook d'audit est injoignable
    depends_on:
      audit-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Collecteur des logs d'audit MinIO (Jours 6-7) ───────────────────────────
  # MinIO ne journalise pas dans un fichier : il POSTe chaque appel S3 sur un
  # webhook. Ce service reçoit ces événements et les écrit en JSON Lines.
  audit-collector:
    image: python:3.12-slim
    container_name: minio-audit-collector
    command: python /app/audit_collector.py --port 9999 --output /audit-logs/audit.jsonl
    volumes:
      - ./audit_collector.py:/app/audit_collector.py:ro
      - ./audit-logs:/audit-logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:9999/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Base de métadonnées Airflow ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Initialisation Airflow (one-shot) ───────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@datalake.local \
          --password admin
    restart: on-failure

  # ── Interface web Airflow ───────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Scheduler Airflow ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
